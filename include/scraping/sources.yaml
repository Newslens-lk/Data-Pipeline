# One entry per source. `type: rss` is preferred where available (cheaper, more stable
# than HTML scraping and less likely to break / get you blocked).
#
# Add your real sources here. Respect each site's robots.txt and terms of service.

- name: example-wire-service
  type: rss
  url: https://example.com/rss/top-stories.xml
  category: general

- name: example-newspaper
  type: html
  seed_urls:
    - https://example.org/section/world/
  article_link_selector: "a.article-link"
  title_selector: "h1"
  body_selector: "div.article-body"
  date_selector: "time[datetime]"
