# Minimal local dev stack: Airflow (single-node, LocalExecutor) + Postgres w/ pgvector.
# NOT for production — managed Airflow (MWAA/Composer/ADF) handles scaling,
# HA, and secrets management for the real deployment. This is for iterating
# on DAG logic before pushing to the cloud.

x-airflow-common: &airflow-common
  build: .
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    PYTHONPATH: /opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./include:/opt/airflow/include
    - ./plugins:/opt/airflow/plugins
  depends_on:
    - airflow-db
    - news-db

services:
  # Airflow's own metadata DB (separate from your pipeline's data warehouse below)
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data

  # Your pipeline's data warehouse: Postgres + pgvector extension
  news-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
      POSTGRES_DB: news_pipeline
    ports:
      - "5433:5432"
    volumes:
      - news_db_data:/var/lib/postgresql/data
      - ./include/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin \
          --firstname admin --lastname admin --role Admin --email admin@example.com
        airflow connections add news_postgres --conn-type postgres \
          --conn-host news-db --conn-login news --conn-password news \
          --conn-schema news_pipeline --conn-port 5432
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      - airflow-init

volumes:
  airflow_db_data:
  news_db_data:
